<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2B networks</title>
  <link rel="stylesheet" href="/assets/style.css">
  <style>
    /* Hero */
    .hero {
      min-height: calc(100vh - 52px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 80px 24px;
    }

    .hero-logo {
      width: 400px;
      margin-bottom: 36px;
    }

    .hero h1 {
      font-size: clamp(52px, 9vw, 88px);
      font-weight: 700;
      letter-spacing: -2.5px;
      line-height: 1.02;
      margin-bottom: 20px;
    }

    .hero p {
      font-size: 19px;
      color: var(--text-secondary);
      max-width: 480px;
      line-height: 1.65;
      margin-bottom: 44px;
    }

    /* Services preview */
    .services-section {
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 80px 24px;
    }

    .services-section-inner {
      max-width: 1100px;
      margin: 0 auto;
    }

    .services-section h2 {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -1px;
      margin-bottom: 48px;
    }

    .view-all {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 32px;
      font-size: 15px;
      font-weight: 500;
      color: var(--accent-start);
      text-decoration: none;
    }

    .view-all:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <a href="/" class="logo-link">
        <img src="/assets/logo.png" alt="2bnetworks">
        <span>2B networks</span>
      </a>
      <nav>
        <a href="/" class="active">Home</a>
        <a href="/services">Services</a>
        <a href="/about">About</a>
      </nav>
    </div>
  </header>

  <section class="hero">
    <img src="/assets/logo.png" alt="" class="hero-logo">
    <h1><span class="gradient-text">2B networks</span></h1>
    <p>個人開発者によるこだわりのプロダクトを、世界へ。</p>
    <a href="/services" class="btn">View Services</a>
  </section>

  <div class="services-section">
    <div class="services-section-inner">
      <p class="section-label">Services</p>
      <h2>開発中のプロダクト</h2>
      <div class="services-grid" id="services-grid"></div>
      <a href="/services" class="view-all">すべてのサービスを見る →</a>
      <script src="/assets/services.js"></script>
      <script>renderServices('services-grid');</script>
    </div>
  </div>

  <footer>
    <div class="footer-inner">
      <img src="/assets/logo.png" alt="2bnetworks">
      <p>© 2026 2B networks. All rights reserved.</p>
    </div>
  </footer>

</body>
</html>
